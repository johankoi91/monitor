<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook 接收记录</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233c;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:26px;margin:0 0 6px}p{color:#65738a;margin:0 0 22px}.toolbar,.summary,.message{background:#fff;border:1px solid #e6eaf1;border-radius:12px}.toolbar{padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.spacer{flex:1}button,select{font:inherit;border:1px solid #d8deea;background:#fff;border-radius:7px;padding:6px 12px;color:#25344e;cursor:pointer}button:hover{color:#1677ff;border-color:#1677ff}button.primary{background:#1677ff;color:white;border-color:#1677ff}button:disabled{opacity:.45;cursor:default}label{display:flex;align-items:center;gap:6px}.summary{display:flex;gap:36px;padding:18px 22px;margin:20px 0}.value{font-size:22px;font-weight:600}.caption,.meta{font-size:12px;color:#718096}#notice{color:#c2410c;margin:14px 0}.message{margin:12px 0;padding:0 20px}.message>summary{cursor:pointer;list-style:none;padding:18px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title{font-weight:600;font-size:15px}.badge{background:#eaf3ff;color:#1677ff;border-radius:5px;padding:2px 7px;font-size:12px}.badge.test{color:#7c3aed;background:#f1eaff}.meta{margin-top:7px;overflow-wrap:anywhere}.bodybar{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding-top:10px;border-top:1px solid #eef1f6}pre{background:#f7f9fc;border:1px solid #e7ecf4;border-radius:8px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:620px;overflow:auto;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:20px}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;padding:20px}.empty{text-align:center;background:#fff;padding:48px;color:#718096;border-radius:12px}@media(max-width:600px){main{margin:20px auto;padding:0 14px}.summary{gap:20px;flex-wrap:wrap}.message{padding:0 14px}.value{font-size:18px}}
</style></head>
<body><main><h1>Webhook 接收记录</h1><p>114.132.190.201 · 查看已验签并持久保存的通知。同一事件的重试已去重。</p>
<div class="toolbar"><button class="primary" id="refresh">刷新消息</button><label><input type="checkbox" id="auto" checked>每 5 秒刷新首页</label><span class="spacer"></span><label>每页<select id="size"><option>20</option><option>50</option><option>100</option></select>条</label></div>
<div class="summary"><div><div class="caption">已保存消息</div><div class="value" id="total">—</div></div><div><div class="caption">接收存储</div><div class="value" id="ready">—</div></div><div><div class="caption">最后刷新</div><div class="value" id="updated">—</div></div></div>
<div id="notice" role="status"></div><div id="messages"></div><div class="pagination"><button id="prev">上一页</button><span id="page">—</span><button id="next">下一页</button></div></main>
<script>
let page=1,total=0,busy=false,lastFingerprint='',expanded=new Set();
const $=id=>document.getElementById(id),date=s=>s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'—';
function element(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function render(records){$('messages').replaceChildren();if(!records.length){$('messages').append(element('div','empty','尚无接收记录'));return;}
for(const record of records){const e=record.event,detail=element('details','message'),summary=element('summary'),row=element('div','row');detail.open=expanded.has(e.event_id);
row.append(element('span','badge'+(e.event_type==='WEBHOOK_TEST'?' test':''),e.event_type==='WEBHOOK_TEST'?'健康检查':'状态通知'),element('span','title',e.node_id||e.service_code),element('span','spacer'),element('span','meta',date(record.received_at)));summary.append(row,element('div','meta','事件 ID：'+e.event_id+' · '+e.previous_status+' → '+e.current_status));detail.append(summary);
const bar=element('div','bodybar'),copy=element('button','','复制消息体'),toggle=element('button','','查看原始文本'),pre=element('pre');let raw=false;const body=record.raw_body||JSON.stringify(e,null,2);pre.textContent=JSON.stringify(e,null,2);bar.append(element('span','caption',record.raw_body?'完整消息体 · 已保存原始文本':'完整消息体 · 历史记录重建'),element('span','spacer'),toggle,copy);
toggle.onclick=()=>{raw=!raw;pre.textContent=raw?body:JSON.stringify(e,null,2);toggle.textContent=raw?'格式化 JSON':'查看原始文本';};copy.onclick=async()=>{try{await navigator.clipboard.writeText(body);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制消息体',1600);}catch{$('notice').textContent='浏览器不支持自动复制，请选中消息体手动复制。';}};
detail.addEventListener('toggle',()=>{if(detail.open)expanded.add(e.event_id);else expanded.delete(e.event_id);});detail.append(bar,pre);$('messages').append(detail);}}
async function load(force=false){if(busy)return;busy=true;$('refresh').disabled=true;try{const size=Number($('size').value),response=await fetch('/api/v1/notifications/recent?limit='+size+'&offset='+((page-1)*size),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw Error(response.status===401?'诊断凭证无效，请重新打开页面登录。':'读取失败（HTTP '+response.status+'）');const data=await response.json();total=data.total;const fingerprint=JSON.stringify(data.events);if(force||fingerprint!==lastFingerprint){render(data.events);lastFingerprint=fingerprint;}$('total').textContent=total;$('ready').textContent=data.ready?'正常':'异常';$('updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});$('page').textContent='第 '+page+' / '+Math.max(1,Math.ceil(total/size))+' 页';$('prev').disabled=page<=1;$('next').disabled=page*size>=total;$('notice').textContent='';}catch(e){$('notice').textContent=e.message;}finally{busy=false;$('refresh').disabled=false;}}
$('refresh').onclick=()=>load();$('prev').onclick=()=>{if(!busy&&page>1){page--;expanded.clear();load(true);}};$('next').onclick=()=>{if(!busy){page++;expanded.clear();load(true);}};$('size').onchange=()=>{page=1;expanded.clear();load(true);};setInterval(()=>{if($('auto').checked&&page===1&&!document.hidden)load();},5000);load();
</script></body></html>
