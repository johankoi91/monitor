services:
  avops-agent:
    image: avops-agent:1.0.0
    container_name: avops-agent
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/avops-monitor/agent.env
    environment:
      AVOPS_DOCKER_SOCKET: /var/run/docker.sock
      AVOPS_AGENT_DATA_DIR: /var/lib/avops-agent
      AVOPS_CADVISOR_URL: http://127.0.0.1:18089
      AVOPS_RAW_STARTUP: "1"
      AVOPS_RESTART_RULES_FILE: /etc/avops-monitor/restart-rules.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/avops-agent:/var/lib/avops-agent
      - /etc/avops-monitor/restart-demo-agent-rules.yaml:/etc/avops-monitor/restart-rules.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
