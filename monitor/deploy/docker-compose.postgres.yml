services:
  avops-postgres:
    image: docker.m.daocloud.io/library/postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
    container_name: avops-postgres
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - /etc/avops-postgres/postgres.env
    volumes:
      - /var/lib/avops-postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "password_encryption=scram-sha-256", "-c", "log_statement=none"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
